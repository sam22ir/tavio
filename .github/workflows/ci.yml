name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tavio
          POSTGRES_PASSWORD: tavio
          POSTGRES_DB: tavio
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U tavio -d tavio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://tavio:tavio@localhost:54329/tavio
      BETTER_AUTH_SECRET: ci-only-not-secret

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Migrate database
        run: pnpm db:migrate

      - name: Seed global reference data
        run: pnpm db:seed

      - name: Integration tests
        run: pnpm test:int

      - name: Build
        run: pnpm build

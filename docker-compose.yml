# On-prem stack. Create a .env file with the variables used below before the first `docker compose up`.
name: tavio

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgres://tavio:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/tavio
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL in .env}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
  BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-}
  CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env}
  PDF_PROVIDER: gotenberg
  GOTENBERG_URL: http://gotenberg:3000
  S3_ENDPOINT: http://s3:8333
  S3_BUCKET: ${S3_BUCKET:-tavio}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: tavio
      POSTGRES_USER: tavio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tavio -d tavio"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: applies SQL migrations (drizzle/) before the app starts.
  migrate:
    build:
      context: .
      target: build
    command: ["./node_modules/.bin/drizzle-kit", "migrate"]
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      <<: *app-env
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      gotenberg:
        condition: service_started
      s3-bucket:
        condition: service_completed_successfully

  # PDF rendering for invoices and receipts.
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped

  # S3-compatible object storage (SeaweedFS) for uploaded and generated files.
  s3:
    image: chrislusf/seaweedfs:3.97
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"tavio","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    volumes:
      - s3data:/data

  # One-shot: creates the bucket the app writes to.
  s3-bucket:
    image: amazon/aws-cli:2.27.0
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $$(seq 1 60); do
          aws --endpoint-url http://s3:8333 s3api head-bucket --bucket ${S3_BUCKET:-tavio} 2>/dev/null && exit 0
          aws --endpoint-url http://s3:8333 s3 mb s3://${S3_BUCKET:-tavio} && exit 0
          sleep 2
        done
        exit 1
    depends_on:
      s3:
        condition: service_started
    restart: "no"

volumes:
  pgdata:
  s3data:

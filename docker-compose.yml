# On-prem stack. Create a .env file with the variables used below before the first `docker compose up`.
name: tavio

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgres://tavio:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/tavio
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL in .env}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
  BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-}
  CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env}
  PDF_PROVIDER: gotenberg
  GOTENBERG_URL: http://gotenberg:3000
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: ${MINIO_BUCKET:-tavio}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: tavio
      POSTGRES_USER: tavio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tavio -d tavio"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: applies SQL migrations (drizzle/) before the app starts.
  migrate:
    build:
      context: .
      target: build
    command: ["./node_modules/.bin/drizzle-kit", "migrate"]
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      <<: *app-env
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      gotenberg:
        condition: service_started
      minio:
        condition: service_started

  # PDF rendering for invoices and receipts.
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped

  # S3-compatible object storage for uploaded and generated files.
  minio:
    image: minio/minio
    command: ["server", "/data", "--console-address", ":9001"]
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
